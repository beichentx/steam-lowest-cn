name: steam-daily

on:
  schedule:
    - cron: '30 0 * * *'        # 北京时间 08:30 每日
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: steam-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests cloudscraper

      - name: 抓取（web→steam 官方 API 回退）
        run: |
          mkdir -p out
          set +e
          python scripts/fetch_steam_lowest.py --mode web --out json \
            --json-path out/steam_lowest.json --icons-dir out/icons --limit 300
          WEB=$?
          COUNT=$(python -c "import json;print(len(json.load(open('out/steam_lowest.json')).get('games',[])))" 2>/dev/null || echo 0)
          echo "web 模式结果: exit=$WEB games=$COUNT"
          if [ "$WEB" != "0" ] || [ "$COUNT" -lt 3 ]; then
            echo "[ci] web 模式失败或数量不足，回退 Steam 官方 API（折扣分级）"
            rm -rf out/icons
            python scripts/fetch_steam_lowest.py --mode steam --out json \
              --json-path out/steam_lowest.json --icons-dir out/icons --limit 100
            STEAM=$?
            if [ "$STEAM" != "0" ]; then
              echo "::error::双通道全部失败 (web=$WEB steam=$STEAM)，数据未产出。脚本内置质量门禁触发（数量<3 或价格全空）——请检查 Valve 接口契约是否再次漂移"
              exit 1
            fi
          fi

      - name: 数据质量门禁
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('out/steam_lowest.json'))
          games = d.get('games', [])
          errors = []
          if len(games) < 3:
              errors.append(f"游戏数 {len(games)} < 3")
          no_price = [g['appid'] for g in games
                      if not g.get('ua_price_cny') and not (g.get('versions') or [])]
          if no_price:
              errors.append(f"{len(no_price)} 款完全无价格: {no_price[:10]}")
          if errors:
              print("::error::质量门禁未通过: " + "; ".join(errors))
              sys.exit(1)
          withv = sum(1 for g in games if g.get('versions'))
          ncn = sum(1 for g in games if g.get('cn_price'))
          print(f"质量门禁通过: {len(games)} 款 / 国服价 {ncn} / 版本覆盖 {withv}")
          PY

      - name: 清理未被当前数据引用的旧图标
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open('out/steam_lowest.json'))
          keep = {f"{g['appid']}.jpg" for g in d['games']}
          idir = 'out/icons'
          if os.path.isdir(idir):
              removed = 0
              for f in os.listdir(idir):
                  if f.endswith('.jpg') and f not in keep:
                      os.remove(os.path.join(idir, f)); removed += 1
              print(f'已清理 {removed} 张过期图标')
          PY

      - name: 发布到仓库根
        run: |
          cp out/steam_lowest.json ./steam_lowest.json
          rm -rf icons && mkdir -p icons && cp out/icons/*.jpg icons/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam_lowest.json icons
          git commit -m "daily $(date -u +%F)" || echo "无变更"
          git push
