name: steam-daily

on:
  schedule:
    - cron: '30 0 * * *'        # 北京时间 08:30 每日
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: steam-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests cloudscraper

      - name: 抓取（web→steam 官方 API 回退）
        run: |
          mkdir -p out
          set +e
          python scripts/fetch_steam_lowest.py --mode web --out json \
            --json-path out/steam_lowest.json --icons-dir out/icons --limit 300
          WEB=$?
          COUNT=$(python -c "import json;print(len(json.load(open('out/steam_lowest.json')).get('games',[])))" 2>/dev/null || echo 0)
          echo "web 模式结果: exit=$WEB games=$COUNT"
          if [ "$WEB" != "0" ] || [ "$COUNT" -lt 3 ]; then
            echo "[ci] web 模式失败或数量不足，回退 Steam 官方 API（折扣分级）"
            rm -rf out/icons
            python scripts/fetch_steam_lowest.py --mode steam --out json \
              --json-path out/steam_lowest.json --icons-dir out/icons --limit 100
          fi

      - name: 清理未被当前数据引用的旧图标
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open('out/steam_lowest.json'))
          keep = {f"{g['appid']}.jpg" for g in d['games']}
          idir = 'out/icons'
          if os.path.isdir(idir):
              removed = 0
              for f in os.listdir(idir):
                  if f.endswith('.jpg') and f not in keep:
                      os.remove(os.path.join(idir, f)); removed += 1
              print(f'已清理 {removed} 张过期图标')
          PY

      - name: 发布到仓库根
        run: |
          cp out/steam_lowest.json ./steam_lowest.json
          rm -rf icons && mkdir -p icons && cp out/icons/*.jpg icons/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add steam_lowest.json icons
          git commit -m "daily $(date -u +%F)" || echo "无变更"
          git push
